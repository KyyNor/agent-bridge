[project]
name = "wiki-manager"
version = "0.1.0"
description = "A Python CLI for managing wiki content."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=48.0.0",
    "fastapi>=0.124.0",
    "httpx>=0.28.0",
    "mcp>=1.27.2",
    "python-multipart>=0.0.20",
    "typer>=0.26.2",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "respx>=0.23.1",
]

[project.scripts]
wiki = "wiki_manager.cli:main"

[tool.pytest.ini_options]
markers = [
    "ragflow: integration tests requiring a live RagFlow server",
    "weknora: integration tests requiring a live Weknora server",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
