[project]
name = "agent-bridge"
version = "0.1.0"
description = "Agent capability and knowledge bridge for managed MCP access."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.0",
    "cryptography>=48.0.0",
    "fastapi>=0.124.0",
    "httpx>=0.28.0",
    "mcp>=1.27.2",
    "python-multipart>=0.0.20",
    "questionary>=2.1.1",
    "typer>=0.26.2",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "respx>=0.23.1",
]

[project.scripts]
agent-bridge = "agent_bridge.cli:main"
agb = "agent_bridge.cli:main"

[tool.pytest.ini_options]
markers = [
    "ragflow: integration tests requiring a live RagFlow server",
    "weknora: integration tests requiring a live Weknora server",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
