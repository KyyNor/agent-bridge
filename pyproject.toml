[project]
name = "agent-bridge"
version = "0.1.0"
description = "Agent capability and knowledge bridge for managed MCP access."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.0,<4",
    "claude-agent-sdk>=0.2.103",
    "cryptography>=48.0.0",
    "fastapi>=0.124.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0,<5",
    "litellm>=1.89.0",
    "loguru>=0.7.2",
    "markitdown[all]>=0.1.6",
    "mcp>=1.27.2",
    "openpyxl>=3.1.0,<4",
    "pageindex==0.3.0.dev1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.0",
    "questionary>=2.1.1",
    "typer>=0.25.1",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-asyncio>=1.0.0",
    "respx>=0.23.1",
]

[project.scripts]
agent-bridge = "agent_bridge.cli:main"
agb = "agent_bridge.cli:main"

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end flows covering multiple application components",
    "codegraph_cli: tests requiring the real CodeGraph CLI and repository indexing",
    "process: tests that start or communicate with a real local server process",
    "ragflow: integration tests requiring a live RagFlow server",
    "weknora: integration tests requiring a live Weknora server",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
