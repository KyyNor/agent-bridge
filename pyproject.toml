[project]
name = "wiki-manager"
version = "0.1.0"
description = "A Python CLI for managing wiki content."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.26.2",
]

[project.scripts]
wiki = "wiki_manager.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
